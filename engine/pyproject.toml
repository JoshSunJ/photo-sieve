[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photosieve"
version = "0.1.0"
description = "Local text-to-photo scoring engine for the Photo Sieve iPhone prototype"
requires-python = ">=3.10,<3.14"
dependencies = [
  "open_clip_torch>=2.26,<4",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[project.scripts]
photosieve = "photosieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
