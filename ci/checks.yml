name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff>=0.9,<1'
      - run: ruff check engine/src engine/tests
      - run: PYTHONPATH=engine/src python -m unittest discover -s engine/tests -v
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_xcode_project.py
      - run: git diff --exit-code -- ios/PhotoSieve.xcodeproj
      - run: xcodebuild -project ios/PhotoSieve.xcodeproj -scheme PhotoSieve -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/photosieve-build CODE_SIGNING_ALLOWED=NO build
